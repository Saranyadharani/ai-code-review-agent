services:
  api:
    build: .
    env_file: .env
    ports:
      - "8010:8000"
    volumes:
      - ./app:/srv/app
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: